services:
  app:
    image: node:22-alpine
    restart: unless-stopped
    working_dir: /app
    environment:
      HOSTNAME: 0.0.0.0
      PORT: 3000
      NEXT_TELEMETRY_DISABLED: 1
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY}
      NEXT_PUBLIC_AUTH_GOOGLE_ENABLED: ${NEXT_PUBLIC_AUTH_GOOGLE_ENABLED}
      NEXT_PUBLIC_AUTH_APPLE_ENABLED: ${NEXT_PUBLIC_AUTH_APPLE_ENABLED}
      AI_PROVIDER: ${AI_PROVIDER}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_TRANSCRIBE_MODEL: ${OPENAI_TRANSCRIBE_MODEL}
      OPENAI_SUMMARY_MODEL: ${OPENAI_SUMMARY_MODEL}
      DEMO_MODE_ENABLED: ${DEMO_MODE_ENABLED}
      NODE_ENV: production
    command: >
      sh -c "
      apk add --no-cache curl tar &&
      rm -rf /app/* &&
      curl -fsSL https://github.com/FAesthetic/project-leader/archive/refs/heads/main.tar.gz |
      tar -xz --strip-components=1 -C /app &&
      npm ci --include=dev &&
      npm run build &&
      npm run start -- -H 0.0.0.0 -p 3000
      "
    networks:
      - web
    labels:
      - traefik.enable=true
      - traefik.docker.network=web
      - traefik.http.routers.leaderjournal-route.rule=Host(`leaderjournal.de`) || Host(`www.leaderjournal.de`)
      - traefik.http.routers.leaderjournal-route.entrypoints=websecure
      - traefik.http.routers.leaderjournal-route.tls=true
      - traefik.http.routers.leaderjournal-route.tls.certresolver=le
      - traefik.http.routers.leaderjournal-route.service=leaderjournal-service
      - traefik.http.routers.leaderjournal-http.rule=Host(`leaderjournal.de`) || Host(`www.leaderjournal.de`)
      - traefik.http.routers.leaderjournal-http.entrypoints=web
      - traefik.http.routers.leaderjournal-http.middlewares=leaderjournal-https
      - traefik.http.routers.leaderjournal-http.service=leaderjournal-service
      - traefik.http.middlewares.leaderjournal-https.redirectscheme.scheme=https
      - traefik.http.services.leaderjournal-service.loadbalancer.server.port=3000
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/ >/dev/null 2>&1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

networks:
  web:
    external: true
