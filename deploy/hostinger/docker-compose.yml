services:
  app:
    image: node:22-alpine
    restart: unless-stopped
    working_dir: /app
    environment:
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY}
      NEXT_PUBLIC_AUTH_GOOGLE_ENABLED: ${NEXT_PUBLIC_AUTH_GOOGLE_ENABLED}
      NEXT_PUBLIC_AUTH_APPLE_ENABLED: ${NEXT_PUBLIC_AUTH_APPLE_ENABLED}
      AI_PROVIDER: ${AI_PROVIDER}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_TRANSCRIBE_MODEL: ${OPENAI_TRANSCRIBE_MODEL}
      OPENAI_SUMMARY_MODEL: ${OPENAI_SUMMARY_MODEL}
      DEMO_MODE_ENABLED: ${DEMO_MODE_ENABLED}
      NODE_ENV: production
    command: >
      sh -c "
      apk add --no-cache curl tar &&
      rm -rf /app/* &&
      curl -fsSL https://github.com/FAesthetic/project-leader/archive/refs/heads/main.tar.gz |
      tar -xz --strip-components=1 -C /app &&
      npm ci &&
      npm run build &&
      npm run start -- -H 0.0.0.0 -p 3000
      "
    expose:
      - "3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/ >/dev/null 2>&1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    command:
      - sh
      - -c
      - |
        cat > /etc/caddy/Caddyfile <<'EOF'
        leaderjournal.de, www.leaderjournal.de {
          encode zstd gzip
          reverse_proxy app:3000
        }
        EOF
        caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
    volumes:
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
